name: build

on:
  push:
    branches: [mac]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - name: Install NASM
        run: brew install nasm

      - name: Assemble and link
        run: |
          nasm -fmacho64 helloworld.asm -o helloworld.o
          gcc helloworld.o -o helloworld

      - name: Run
        run: ./helloworld
