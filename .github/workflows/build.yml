name: build

on:
  push:
    branches: [linux]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Assemble and link
        run: |
          nasm -felf64 helloworld.asm -o helloworld.o
          gcc -no-pie helloworld.o -o helloworld

      - name: Run
        run: ./helloworld
