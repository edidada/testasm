name: baremetal

on:
  push:
    branches: [mac, baremetal]
  pull_request:
  workflow_dispatch:

jobs:
  baremetal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools (nasm, qemu, 32-bit gcc)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 gcc-multilib

      - name: Build and run bare-metal program in QEMU
        run: bash docs/baremetal/build.sh

      - name: Show program execution result
        if: always()
        run: |
          echo "----- bare-metal program output (serial.out) -----"
          cat docs/baremetal/serial.out
